[project]
name = "netcontrol-backend"
version = "0.1.0"
description = "NetControl — backend de supervision réseau (BSRQ.MEDIA, JOJ Dakar 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# pip install -e ".[real]" quand on branche du matériel.
real = ["netmiko>=4.3", "httpx>=0.27", "pysnmp-lextudio>=5.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
