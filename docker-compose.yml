# NetControl — bascule automatiquement entre simulation et sources réelles
# (switch Netmiko, Zabbix) selon ce qui est renseigné dans backend/.env.
# Sans ce fichier (ou vide), l'app tourne en 100% simulation, comme avant.
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - netcontrol-data:/srv/netcontrol/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  #  Zabbix — socle de collecte réel 
  # Après le premier `docker compose up -d` : http://<ce-serveur>:8081
  # (Admin / zabbix — à changer immédiatement), puis Administration >
  # API tokens pour générer le token que connect-zabbix.sh te demandera.
  # ZABBIX_DB_PASSWORD : à définir dans un .env à la racine (PAS backend/.env)
  # pour la prod — sinon un mot de passe par défaut est utilisé (à changer).
  zabbix-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_change_me}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-alpine-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_change_me}
      POSTGRES_DB: zabbix
    depends_on:
      - zabbix-db
    ports:
      - "10051:10051"  # port agents Zabbix (bornes/switchs qui enverraient des traps)
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-alpine-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_change_me}
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Africa/Dakar
    depends_on:
      - zabbix-server
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  netcontrol-data:
  zabbix-db-data:
